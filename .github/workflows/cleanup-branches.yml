name: Cleanup Merged Branches

on:
  pull_request:
    types: [ closed ]
    branches: [ develop ]

permissions:
  contents: write
 
jobs:
  delete-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
    - name: Delete merged branch
      run: |
        BRANCH_NAME="${{ github.head_ref }}"
        
        # Check if it's a feature or hotfix branch
        if [[ "$BRANCH_NAME" == feature/* ]] || [[ "$BRANCH_NAME" == hotfix/* ]]; then
          echo "🗑️ Deleting merged branch: $BRANCH_NAME"
          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/git/refs/heads/$BRANCH_NAME"
          echo "✅ Branch deleted successfully"
        else
          echo "ℹ️ Branch $BRANCH_NAME is not a feature or hotfix branch. Skipping deletion."
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}