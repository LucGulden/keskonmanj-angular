<section class="stock-section">
  <div class="section-container">
    <div class="stock-content">
      <h2>{{ 'stock.title' | translate }}</h2>
      <p class="section-description">
        {{ 'stock.description' | translate }}
      </p>

      <ul class="features-list">
        <li>
          <span class="check-icon">✓</span>
          <span>{{ 'stock.feature.add' | translate }}</span>
        </li>
        <li>
          <span class="check-icon">✓</span>
          <span>{{ 'stock.feature.expiry' | translate }}</span>
        </li>
        <li>
          <span class="check-icon">✓</span>
          <span>{{ 'stock.feature.suggestions' | translate }}</span>
        </li>
      </ul>

      <button class="btn-manage-stock">{{ 'stock.button.manage' | translate }}</button>
    </div>

    <div class="stock-image">
      <img src="images/pantry-stock.png"
           [alt]="'stock.image.alt' | translate">
    </div>
  </div>
</section>
