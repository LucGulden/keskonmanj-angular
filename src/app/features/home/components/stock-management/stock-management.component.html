<section class="stock-section">
  <div class="section-container">
    <div class="stock-content">
      <h2 i18n="@@stock.title">Gérez votre stock d'ingrédients</h2>
      <p class="section-description" i18n="@@stock.description">
        Maintenez à jour votre inventaire pour des suggestions de recettes
        encore plus précises et personnalisées.
      </p>
      
      <ul class="features-list">
        <li>
          <span class="check-icon">✓</span>
          <span i18n="@@stock.feature.add">Ajout rapide d'ingrédients par scan ou recherche</span>
        </li>
        <li>
          <span class="check-icon">✓</span>
          <span i18n="@@stock.feature.expiry">Suivi des dates d'expiration</span>
        </li>
        <li>
          <span class="check-icon">✓</span>
          <span i18n="@@stock.feature.suggestions">Suggestions automatiques basées sur votre stock</span>
        </li>
      </ul>
      
      <button class="btn-manage-stock" i18n="@@stock.button.manage">📦 Gérer mon stock</button>
    </div>
    
    <div class="stock-image">
      <img src="images/pantry-stock.png" 
           i18n-alt="@@stock.image.alt"
           alt="Garde-manger organisé">
    </div>
  </div>
</section>
