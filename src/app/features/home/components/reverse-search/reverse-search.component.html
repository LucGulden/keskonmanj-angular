<section class="reverse-search-section">
  <div class="section-container">
    <h2 i18n="@@reverseSearch.title">Recherche Inversée</h2>
    <p class="section-subtitle" i18n="@@reverseSearch.subtitle">
      Sélectionnez vos ingrédients et découvrez ce que vous pouvez cuisiner
    </p>
    
    <div class="ingredients-wrapper">
      <div class="ingredients-grid">
        <app-ingredient-card 
          *ngFor="let ingredient of ingredients; trackBy: trackByIngredientId"
          [ingredient]="ingredient">
        </app-ingredient-card>
      </div>
      
      <button class="btn-find-recipes">✨ Trouver des recettes</button>
    </div>
  </div>
</section>
