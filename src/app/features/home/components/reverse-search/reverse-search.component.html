<section class="reverse-search-section">
  <div class="section-container">
    <h2>{{ 'reverseSearch.title' | translate }}</h2>
    <p class="section-subtitle">
      {{ 'reverseSearch.subtitle' | translate }}
    </p>

    <div class="ingredients-wrapper">
      <div class="ingredients-grid">
        <app-ingredient-card
          *ngFor="let ingredient of ingredients; trackBy: trackByIngredientId"
          [ingredient]="ingredient">
        </app-ingredient-card>
      </div>

      <button class="btn-find-recipes">{{ 'reverseSearch.button.find' | translate }}</button>
    </div>
  </div>
</section>
