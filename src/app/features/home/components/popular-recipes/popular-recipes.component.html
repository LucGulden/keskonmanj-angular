<section class="popular-recipes-section">
  <div class="section-container">
    <div class="section-header">
      <h2 i18n="@@popularRecipes.title">Recettes populaires</h2>
      <a href="#" class="view-all" i18n="@@popularRecipes.viewAll">Voir toutes les recettes →</a>
    </div>
    
    <div class="carousel-wrapper">
      <button 
        class="carousel-btn prev" 
        (click)="previousSlide()"
        [disabled]="!canGoBack"
        [class.disabled]="!canGoBack">
        ‹
      </button>
      
      <div class="recipes-grid">
        <app-recipe-card 
          *ngFor="let recipe of visibleRecipes"
          [recipe]="recipe"
          class="recipe-item">
        </app-recipe-card>
      </div>
      
      <button 
        class="carousel-btn next" 
        (click)="nextSlide()"
        [disabled]="!canGoForward"
        [class.disabled]="!canGoForward">
        ›
      </button>
    </div>
    
    <div class="carousel-indicators">
      <span 
        *ngFor="let recipe of recipes; let i = index"
        class="indicator"
        [class.active]="i >= currentIndex && i < currentIndex + 4"
        (click)="currentIndex = i">
      </span>
    </div>
  </div>
</section>
