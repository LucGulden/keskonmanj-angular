<section class="hero-section">
  <div class="hero-container">
    <div class="hero-content">
      <h1>{{ 'hero.title' | translate }}</h1>
      <p>
        {{ 'hero.description' | translate }}
      </p>
      <div class="hero-actions">
        <button class="btn-primary">{{ 'hero.button.reverse' | translate }}</button>
        <button class="btn-secondary">{{ 'hero.button.browse' | translate }}</button>
      </div>
    </div>
    <div class="hero-image">
      <img src="images/kitchen-hero.png"
           [alt]="'hero.image.alt' | translate">
    </div>
  </div>
</section>
