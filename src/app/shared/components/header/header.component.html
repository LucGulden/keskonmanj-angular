<header class="header">
  <div class="header-container">
    <div class="logo">
      <div class="logo-icon">K</div>
      <span class="logo-text" i18n="@@app.name">Keskonmanj</span>
    </div>

    <nav class="nav-desktop">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" 
         i18n="@@nav.home">Accueil</a>
      <a routerLink="/recipes" routerLinkActive="active" 
         i18n="@@nav.recipes">Recettes</a>
      <a routerLink="/stock" routerLinkActive="active" 
         i18n="@@nav.stock">Mon Stock</a>
      <a routerLink="/favorites" routerLinkActive="active" 
         i18n="@@nav.favorites">Favoris</a>
    </nav>

    <div class="header-actions">
      <div class="search-bar">
        <input type="text" 
               i18n-placeholder="@@search.placeholder"
               placeholder="Rechercher une recette...">
        <button class="search-btn">
          <span class="icon">🔍</span>
        </button>
      </div>
      <app-language-selector></app-language-selector>
      <button class="btn-add" i18n="@@button.add">+ Ajouter</button>
      <div class="user-avatar">
        <img src="https://www.svgrepo.com/show/384670/account-avatar-profile-user.svg" alt="User">
      </div>
    </div>

    <button class="menu-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <nav class="nav-mobile" [class.active]="isMenuOpen">
    <a routerLink="/" (click)="toggleMenu()" i18n="@@nav.home">Accueil</a>
    <a routerLink="/recipes" (click)="toggleMenu()" i18n="@@nav.recipes">Recettes</a>
    <a routerLink="/stock" (click)="toggleMenu()" i18n="@@nav.stock">Mon Stock</a>
    <a routerLink="/favorites" (click)="toggleMenu()" i18n="@@nav.favorites">Favoris</a>
  </nav>
</header>
