<div class="recipe-card">
  <div class="recipe-image">
    <img [src]="recipe.imageUrl" [alt]="recipe.title">
  </div>
  <div class="recipe-content">
    <h3>{{ recipe.title }}</h3>
    <p class="recipe-description">{{ recipe.description }}</p>
    <div class="recipe-meta">
      <span class="meta-item">⏱️ {{ recipe.prepTime }} {{ 'recipe.time.minutes' | translate }}</span>
      <span class="meta-item">👥 {{ recipe.servings }} {{ 'recipe.servings.people' | translate }}</span>
      <span class="meta-item">⭐ {{ recipe.rating }}</span>
    </div>
    <button class="btn-view-recipe">{{ 'recipe.button.view' | translate }}</button>
  </div>
</div>
