# SonarCloud Configuration
# Documentation: https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

# IMPORTANT : Remplacez ces valeurs par les vôtres après avoir créé le projet sur SonarCloud
sonar.projectKey=LucGulden_keskonmanj-angular
sonar.organization=lucgulden

# Metadata
sonar.projectName=KeskOnManj Angular
sonar.projectVersion=1.0

# Source code
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.spec.ts,\
  **/test/**,\
  **/e2e/**,\
  **/*.stories.ts,\
  **/*.module.ts

# Test coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# TypeScript configuration
sonar.typescript.tsconfigPath=tsconfig.json

# Duplication detection
sonar.cpd.exclusions=**/*.spec.ts

# Quality Gate (optionnel - valeurs par défaut)
# sonar.qualitygate.wait=true